<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#008000;stop-opacity:1" />
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" />
    </filter>
  </defs>

  <rect width="200" height="200" fill="#000" />

  <!-- Main Shape -->
  <path d="M 50 100 L 100 50 L 150 100 L 100 150 Z" fill="none" stroke="url(#glow)" stroke-width="10" />

  <!-- Inner glow -->
  <path d="M 50 100 L 100 50 L 150 100 L 100 150 Z" fill="none" stroke="#00FF00" stroke-width="5" filter="url(#blur)" />

  <!-- Center Dot -->
  <circle cx="100" cy="100" r="10" fill="url(#glow)" />
</svg>